<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nummerserier till CSV</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5f6b7a;
    --border: #d5dae1; --accent: #1f6feb; --accent-text: #ffffff; --error: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --card: #1b2028; --text: #e6e9ee; --muted: #9aa5b4;
      --border: #313a46; --accent: #4c8dff; --accent-text: #0b0e12; --error: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 12px; align-items: end; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    font-variant-numeric: tabular-nums;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; padding: 10px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .remove { padding: 10px 12px; }
  .info { margin-top: 10px; font-size: .9rem; color: var(--muted); min-height: 1.4em; }
  .info.error { color: var(--error); }
  .info code { color: var(--text); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
  .downloads { display: flex; flex-direction: column; gap: 8px; }
  .downloads button { text-align: left; }
  footer { margin-top: 32px; font-size: .85rem; color: var(--muted); }
  @media (max-width: 560px) {
    .row { grid-template-columns: 1fr 1fr; }
    .remove { grid-column: 2; }
  }
</style>
</head>
<body>
<main>
  <h1>Nummerserier till CSV</h1>
  <p class="lead">Ange start- och slutnummer. Varje serie blir en egen CSV-fil med kolumnerna <strong>Nummer</strong> och <strong>Info</strong> (alltid 0).</p>

  <form id="form" autocomplete="off" novalidate>
    <div id="ranges"></div>

    <div class="actions">
      <button type="button" id="add">+ Lägg till serie</button>
      <button type="submit" class="primary" id="download-all">Ladda ner CSV</button>
    </div>
  </form>

  <div class="downloads" id="downloads"></div>

  <footer>Allt räknas ut direkt i webbläsaren. Inget skickas iväg och inget sparas.</footer>
</main>

<template id="range-template">
  <div class="card range">
    <div class="row">
      <div>
        <label>Start</label>
        <input class="start" inputmode="numeric" autocomplete="off" placeholder="10 000 100">
      </div>
      <div>
        <label>Slut</label>
        <input class="end" inputmode="numeric" autocomplete="off" placeholder="10 200 000">
      </div>
      <div>
        <label>Typ</label>
        <select class="type">
          <option value="">Ingen</option>
          <option value="USB-A">USB-A</option>
          <option value="USB-C">USB-C</option>
        </select>
      </div>
      <button type="button" class="remove" title="Ta bort serie" aria-label="Ta bort serie">✕</button>
    </div>
    <div class="info"></div>
  </div>
</template>

<script>
(() => {
  const rangesEl = document.getElementById('ranges');
  const template = document.getElementById('range-template');
  const downloadsEl = document.getElementById('downloads');
  const MAX_ROWS = 5000000;

  // Tar bort mellanslag, punkter, kommatecken m.m. så att "10 000 100" fungerar.
  const clean = (value) => value.replace(/[\s.,'  _-]/g, '');

  function parseRange(card) {
    const startRaw = clean(card.querySelector('.start').value);
    const endRaw = clean(card.querySelector('.end').value);
    if (!startRaw && !endRaw) return { empty: true };
    if (!/^\d+$/.test(startRaw) || !/^\d+$/.test(endRaw)) {
      return { error: 'Ange både start och slut med bara siffror.' };
    }
    const start = BigInt(startRaw);
    const end = BigInt(endRaw);
    if (end < start) return { error: 'Slutnumret måste vara större än eller lika med startnumret.' };
    const count = end - start + 1n;
    if (count > BigInt(MAX_ROWS)) {
      return { error: `För många nummer (${fmt(count)}). Max ${fmt(MAX_ROWS)} per serie.` };
    }
    // Behåll inledande nollor om startnumret har det, t.ex. 000100.
    const width = startRaw.startsWith('0') ? startRaw.length : 0;
    const type = card.querySelector('.type').value;
    return { startRaw, endRaw, start, end, count, width, type };
  }

  const fmt = (n) => n.toLocaleString('sv-SE');

  function updateInfo(card) {
    const info = card.querySelector('.info');
    const r = parseRange(card);
    info.classList.toggle('error', !!r.error);
    if (r.empty) { info.textContent = ''; return; }
    if (r.error) { info.textContent = r.error; return; }
    const first = pad(r.start, r.width);
    const last = pad(r.end, r.width);
    info.innerHTML = '';
    info.append(`${fmt(r.count)} nummer: `);
    const code = document.createElement('code');
    code.textContent = r.count === 1n ? first : `${first} … ${last}`;
    info.append(code, ` → ${fileName(r)}`);
  }

  const pad = (n, width) => width ? n.toString().padStart(width, '0') : n.toString();

  function today() {
    const d = new Date();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${mm}-${dd}`;
  }

  const fileName = (r) => `Nummer-${r.startRaw}-${r.endRaw}-${today()}${r.type ? '-' + r.type : ''}.csv`;

  function buildCsv(r) {
    const parts = ['Nummer,Info\r\n'];
    let chunk = '';
    let i = 0;
    for (let n = r.start; n <= r.end; n++) {
      chunk += pad(n, r.width) + ',0\r\n';
      if (++i % 50000 === 0) { parts.push(chunk); chunk = ''; }
    }
    parts.push(chunk);
    return new Blob(parts, { type: 'text/csv;charset=utf-8' });
  }

  function download(r) {
    const url = URL.createObjectURL(buildCsv(r));
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName(r);
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  function addRange() {
    const node = template.content.firstElementChild.cloneNode(true);
    node.querySelectorAll('input, select').forEach((input) =>
      input.addEventListener('input', () => updateInfo(node)));
    node.querySelector('.remove').addEventListener('click', () => {
      if (rangesEl.children.length > 1) node.remove();
      else {
        node.querySelectorAll('input').forEach((i) => { i.value = ''; });
        node.querySelector('.type').value = '';
        updateInfo(node);
      }
    });
    rangesEl.append(node);
    node.querySelector('.start').focus();
  }

  document.getElementById('add').addEventListener('click', addRange);

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    downloadsEl.innerHTML = '';
    const cards = [...rangesEl.children];
    cards.forEach(updateInfo);
    const parsed = cards.map(parseRange).filter((r) => !r.empty);
    if (!parsed.length) { alert('Ange minst en serie.'); return; }
    if (parsed.some((r) => r.error)) { alert('Rätta de markerade serierna först.'); return; }

    // Ladda ner filerna en i taget med en kort paus så att webbläsaren inte blockerar dem.
    for (const r of parsed) {
      download(r);
      await new Promise((res) => setTimeout(res, 400));
    }

    // Reservknappar om webbläsaren blockerade flera nedladdningar.
    if (parsed.length > 1) {
      const p = document.createElement('p');
      p.className = 'info';
      p.textContent = 'Kom inte alla filer? Klicka på dem här:';
      downloadsEl.append(p);
      for (const r of parsed) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = '⬇ ' + fileName(r);
        b.addEventListener('click', () => download(r));
        downloadsEl.append(b);
      }
    }
  });

  addRange();
})();
</script>
</body>
</html>
